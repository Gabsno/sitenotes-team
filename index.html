<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<title>Daily site report</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0F172A;--navy3:#334155;--orange:#ea580c;--orange-d:#c2410c;--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--red:#dc2626;--green:#16a34a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif}
header{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:22px 22px;border-bottom:3px solid var(--orange)}
header h1{margin:0;font-size:18px}header p{margin:3px 0 0;color:#cbd5e1;font-size:13px}
main{padding:14px 16px calc(100px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:8px}h2 .n{background:var(--navy);color:#fff;border-radius:999px;font-size:11px;padding:1px 8px;letter-spacing:0}
h2.safe{color:var(--green)}
label{display:block;font-size:13px;color:var(--navy3);font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:inherit}
textarea{min-height:88px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid var(--orange);outline-offset:-1px;border-color:var(--orange)}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}input[type=date],input[type=time]{min-width:0;-webkit-appearance:none;appearance:none;min-height:44px}
.btn{font:inherit;font-weight:600;border:1px solid #cbd5e1;background:#fff;color:var(--navy);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#fff}.btn.sm{min-height:36px;padding:6px 10px;font-size:13px}.btn.ghost{border-style:dashed;width:100%;color:var(--navy3)}
.btn:disabled{opacity:.5}
.yn{display:flex;gap:8px;margin-top:4px}.yn button{flex:1;font:inherit;font-weight:600;min-height:44px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;color:var(--navy3);cursor:pointer}
.yn button.on.y{background:#dcfce7;border-color:#86efac;color:#166534}.yn button.on.n{background:#fee2e2;border-color:#fca5a5;color:#991b1b}.yn button.on.m{background:#e2e8f0;border-color:#94a3b8;color:#334155}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{font:inherit;font-size:13px;border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:8px 12px;color:var(--navy3);cursor:pointer;min-height:38px}.chip.on{background:#fff7ed;border-color:var(--orange);color:var(--orange-d);font-weight:600}
.q{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.q:first-of-type{margin-top:4px;padding-top:0;border-top:0}.q>b{display:block;font-size:14px}
.issue{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;background:#f8fafc;position:relative}.issue .x{position:absolute;top:6px;right:6px;border:0;background:none;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:4px 8px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.t{position:relative;width:84px}.t img{width:84px;height:84px;object-fit:cover;border-radius:8px;display:block;border:1px solid var(--line)}
.t input{margin-top:4px;font-size:12px;padding:4px 6px;border-radius:6px}.t .x{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:14px;line-height:24px;text-align:center;padding:0;cursor:pointer}
.line{display:flex;gap:6px;align-items:center;margin-top:6px}.line input{flex:1;min-width:0}.line .x{flex:none;border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px}
.mat{display:grid;grid-template-columns:24px 1fr 76px 76px 28px;gap:6px;align-items:center;margin-top:6px}.mat i{font-style:normal;color:var(--muted);font-size:13px;text-align:right}.mat .x{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:0}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}.dock .btn.pri{flex:1;font-size:16px}
.muted{color:var(--muted);font-size:13px}.bad{color:var(--red)}
.banner{border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}.banner.good{background:#f0fdf4;border-color:#bbf7d0;color:#166534}
.center{text-align:center;padding:40px 12px}.center h2{font-size:18px;text-transform:none;letter-spacing:0;color:var(--text);justify-content:center}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #fff;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-3px;margin-right:6px}@keyframes s{to{transform:rotate(360deg)}}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
</style>
</head>
<body>
<header><h1>Daily site report</h1><p id="who">Loading…</p></header>
<main id="main"></main>
<input type="file" id="cam" accept="image/*" capture="environment" hidden><input type="file" id="gal" accept="image/*" multiple hidden>
<script>
'use strict';
const RELAY = 'https://sitenotes-relay.gabsno.workers.dev';
const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* full */ } };
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const lines = s => String(s || '').split('\n').map(x => x.replace(/^[\s\-•*⁃\d.)]+/, '').trim()).filter(Boolean);
const WEATHER = ['Sunny / dry', 'Cloudy', 'Light rain', 'Heavy rain — work stopped', 'Very hot'];
const blank = () => ({ projectId: ls('lastProject', ''), projectName: '', date: today(), arrive: '', leave: '', weather: WEATHER[0], weatherNote: '',
  crew: ls('lastCrew', null) || [''], done: '', outstanding: '', materials: [{ item: '', qty: '', unit: '' }],
  safety: blankSafety(), issues: [], deliveries: '', notes: '' });
// Safety checks. 'bad' is the answer that needs attention; text fields are asked only when relevant.
const HIRISK = ['Work at height', 'Hot work (welding, brazing, cutting)', 'Electrical / live work', 'Confined space', 'Excavation / trench', 'Lifting / heavy loads', 'Chasing / core drilling'];
const INCIDENT_TYPES = ['Near miss — no one hurt', 'Minor injury — first aid only', 'Injury — sent to clinic / hospital', 'Damage to property or equipment'];
const YN = [['yes', 'Yes', 'y'], ['no', 'No', 'n']], YNA = [...YN, ['na', 'N/A', 'm']];
function blankSafety() { return { ppe: '', ppeNote: '', toolbox: '', toolboxTopic: '', hiRisk: [], permits: '', permitNote: '', access: '', tools: '', fire: '', firstAidKit: '', incident: '', incidentType: '', incidentNote: '', hazards: '', housekeeping: '' }; }
const code = new URLSearchParams(location.search).get('c') || ls('code', '');
let me = ls('me', null), photos = [], draft = ls('draft2', null) || blank();
draft.safety = { ...blankSafety(), ...draft.safety }; // drafts saved before the safety section grew
const main = $('#main');

if (!code) { main.innerHTML = `<div class="card center"><h2>You need your personal link</h2><p class="muted">Ask your supervisor for your report link and open it from WhatsApp. It remembers you after that.</p></div>`; $('#who').textContent = 'No link'; }
else { lsSet('code', code); start(); }

async function start() {
  try {
    const r = await fetch(`${RELAY}/me?code=${encodeURIComponent(code)}`, { signal: AbortSignal.timeout(12000) });
    if (r.status === 403) { localStorage.removeItem('code'); main.innerHTML = `<div class="card center"><h2>This link is no longer valid</h2><p class="muted">Ask your supervisor for a new one.</p></div>`; $('#who').textContent = ''; return; }
    if (r.ok) { me = await r.json(); lsSet('me', me); }
  } catch { /* offline: use what we remembered */ }
  if (!me) { main.innerHTML = '<div class="card center"><h2>No connection</h2><p class="muted">Turn on data once so the page can check your link, then try again.</p><button class="btn pri" onclick="location.reload()">Try again</button></div>'; return; }
  $('#who').textContent = `${me.name} · daily report`;
  draw();
}
// answer buttons: [value, label, 'y' = good (green) | 'n' = needs attention (red) | 'm' = not applicable (grey)]
const safetyQs = () => ['ppe', 'toolbox', ...(draft.safety.hiRisk.length ? ['permits'] : []), 'access', 'tools', 'fire', 'firstAidKit', 'incident', 'housekeeping'];
const safetyDone = () => { const q = safetyQs(); return `${q.filter(k => draft.safety[k]).length}/${q.length}`; };
const yn = (k, opts = YN) => `<div class="yn" data-yn="${k}">${opts.map(([v, l, c]) => `<button type="button" class="${c} ${draft.safety[k] === v ? 'on' : ''}" data-v="${v}">${l}</button>`).join('')}</div>`;
function draw() {
  const d = draft, ps = me.projects || [], s = d.safety;
  main.innerHTML = `
  ${ls('lastSent', null) ? `<div class="banner good">Last report sent ${new Date(ls('lastSent')).toLocaleString('en-GB', { weekday: 'short', hour: '2-digit', minute: '2-digit' })} ✓</div>` : ''}
  <section class="card"><h2>Report from</h2>
    ${ps.length ? `<select id="pid"><option value="">Choose the site…</option>${ps.map(p => `<option value="${esc(p.id)}" ${d.projectId === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}<option value="other" ${d.projectId === 'other' ? 'selected' : ''}>Other (type below)</option></select>` : ''}
    <input id="pname" placeholder="Site / project name, e.g. DGL" value="${esc(d.projectName || '')}" style="margin-top:8px;${ps.length && d.projectId !== 'other' ? 'display:none' : ''}">
    <label>Date</label><input type="date" id="date" value="${esc(d.date)}">
    <div class="g2"><div><label>Time in</label><input type="time" id="arrive" value="${esc(d.arrive)}"></div><div><label>Time out</label><input type="time" id="leave" value="${esc(d.leave)}"></div></div>
    <label>Weather</label><select id="weather">${WEATHER.map(w => `<option ${d.weather === w ? 'selected' : ''}>${w}</option>`).join('')}</select>
    <input id="weatherNote" placeholder="Effect on work (optional), e.g. stopped 1 h" value="${esc(d.weatherNote)}" style="margin-top:6px">
  </section>
  <section class="card"><h2>Technicians on site <span class="n" id="crewn">${d.crew.filter(x => x.trim()).length}</span></h2>
    <div id="crew">${d.crew.map((c, i) => `<div class="line"><input placeholder="Name" value="${esc(c)}" data-crew="${i}"><button class="x" data-a="delcrew" data-i="${i}" aria-label="Remove">×</button></div>`).join('')}</div>
    <button class="btn ghost" data-a="addcrew" style="margin-top:8px">+ Add technician</button><p class="hint">Remembered for tomorrow — just remove anyone who isn't on site.</p></section>
  <section class="card"><h2>Work carried out</h2><textarea id="done" placeholder="One item per line, e.g.&#10;Cut and chiselled openings for copper pipes on 2nd floor">${esc(d.done)}</textarea>
    <div class="thumbs" id="gph"></div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn sm" data-a="cam" data-i="-1">📷 Photo of the work</button><button class="btn sm" data-a="gal" data-i="-1">🖼 Gallery</button></div></section>
  <section class="card"><h2>Outstanding work</h2><textarea id="outstanding" placeholder="What is still left to do, one per line, e.g.&#10;Support works for mezzanine and ground floor">${esc(d.outstanding)}</textarea></section>
  <section class="card"><h2>Materials needed</h2><div id="mats">${d.materials.map((m, i) => `<div class="mat" data-m="${i}"><i>${i + 1}.</i><input placeholder="Item, e.g. 10 mm nut" value="${esc(m.item)}" data-k="item"><input placeholder="Qty" inputmode="decimal" value="${esc(m.qty)}" data-k="qty"><input placeholder="Unit" value="${esc(m.unit)}" data-k="unit" list="units"><button class="x" data-a="delmat" data-i="${i}" aria-label="Remove">×</button></div>`).join('')}</div>
    <datalist id="units"><option value="pcs"><option value="boxes"><option value="m"><option value="lengths"><option value="bags"><option value="rolls"><option value="L"><option value="kg"><option value="sets"></datalist>
    <button class="btn ghost" data-a="addmat" style="margin-top:10px">+ Add material</button></section>
  <section class="card"><h2 class="safe">⛑ Safety <span class="n" style="background:var(--green)" id="safen">${safetyDone()}</span></h2>
    <div class="q"><b>1. PPE worn by everyone?</b><span class="hint">Helmet, safety boots, reflective vest, gloves; goggles and ear protection for cutting and drilling</span>${yn('ppe')}
      ${s.ppe === 'no' ? `<input id="ppeNote" placeholder="Who, and what was missing?" value="${esc(s.ppeNote)}" style="margin-top:6px">` : ''}</div>
    <div class="q"><b>2. Toolbox talk held this morning?</b>${yn('toolbox')}
      ${s.toolbox === 'yes' ? `<input id="toolboxTopic" placeholder="Topic, e.g. working at height, using the grinder" value="${esc(s.toolboxTopic)}" style="margin-top:6px">` : ''}</div>
    <div class="q"><b>3. High-risk work done today</b><span class="hint">Tap all that apply — leave empty if none</span>
      <div class="chips">${HIRISK.map(h => `<button type="button" class="chip ${s.hiRisk.includes(h) ? 'on' : ''}" data-hr="${esc(h)}">${esc(h)}</button>`).join('')}</div>
      ${s.hiRisk.length ? `<b style="display:block;margin-top:12px;font-size:14px">Permits and controls in place for it?</b><span class="hint">Permit to work, power isolated and locked off, harness tied off, fire watch, gas test, barriers…</span>${yn('permits')}
        ${s.permits === 'no' ? `<input id="permitNote" placeholder="What was missing?" value="${esc(s.permitNote)}" style="margin-top:6px">` : ''}` : ''}</div>
    <div class="q"><b>4. Ladders, scaffolds and platforms checked before use?</b>${yn('access', YNA)}</div>
    <div class="q"><b>5. Power tools, grinders and extension leads in good condition?</b><span class="hint">Guards on, no damaged cables, leads off the floor in wet areas</span>${yn('tools', YNA)}</div>
    <div class="q"><b>6. Fire extinguisher nearby during hot work?</b>${yn('fire', YNA)}</div>
    <div class="q"><b>7. First aid kit available on site?</b>${yn('firstAidKit')}</div>
    <div class="q"><b>8. Any injury, accident or near miss?</b>${yn('incident', [['no', 'None', 'y'], ['yes', 'Yes', 'n']])}
      ${s.incident === 'yes' ? `<select id="incidentType" style="margin-top:6px"><option value="">What kind?</option>${INCIDENT_TYPES.map(x => `<option ${s.incidentType === x ? 'selected' : ''}>${x}</option>`).join('')}</select>
        <textarea id="incidentNote" placeholder="What happened, who was involved, first aid given, what was done to stop it happening again" style="margin-top:6px;min-height:80px">${esc(s.incidentNote)}</textarea>` : ''}</div>
    <div class="q"><b>9. Work area left clean and safe at the end of the day?</b><span class="hint">Waste cleared, floor openings covered, power off, tools locked away</span>${yn('housekeeping')}</div>
    <div class="q"><b>Unsafe conditions or unsafe acts seen</b><textarea id="hazards" placeholder="e.g. open floor edge, loose scaffold board, someone at height without a harness — and what was done about it. Leave empty if none." style="margin-top:6px;min-height:64px">${esc(s.hazards)}</textarea>
      <div class="thumbs" data-ph="-2"></div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn sm" data-a="cam" data-i="-2">📷 Photo</button><button class="btn sm" data-a="gal" data-i="-2">🖼 Gallery</button></div></div>
  </section>
  <section class="card"><h2>Problems / delays</h2><p class="hint" style="margin-top:-4px">Anything that needs attention: leaks, damage, missing drawings, client changes, waiting on others…</p>
    <div id="issues">${d.issues.map((x, i) => issueHtml(x, i)).join('')}</div>
    <button class="btn ghost" data-a="addissue" style="margin-top:10px">+ Add a problem</button></section>
  <section class="card"><h2>Deliveries & visitors</h2><textarea id="deliveries" placeholder="e.g. 20 lengths of copper pipe delivered; consultant visited 2 pm" style="min-height:64px">${esc(d.deliveries)}</textarea></section>
  <section class="card"><h2>Anything else</h2><textarea id="notes" placeholder="Anything else to report" style="min-height:64px">${esc(d.notes)}</textarea></section>
  <p class="muted" style="text-align:center">Your report is kept on this phone until it is sent, so nothing is lost if the signal drops.</p>`;
  drawPhotos();
  document.querySelector('.dock')?.remove();
  const dock = document.createElement('div'); dock.className = 'dock'; dock.innerHTML = `<span class="muted" id="st"></span><button class="btn pri" id="send">Send report</button>`; document.body.append(dock);
  main.oninput = e => { readForm(); if (e.target.id === 'pid') $('#pname').style.display = e.target.value === 'other' || !e.target.value ? '' : 'none'; if (e.target.dataset.crew != null) $('#crewn').textContent = draft.crew.filter(x => x.trim()).length; };
  main.onchange = main.oninput;
  main.onclick = e => {
    const hr = e.target.closest('[data-hr]'); if (hr) { readForm(); const l = draft.safety.hiRisk, h = hr.dataset.hr; draft.safety.hiRisk = l.includes(h) ? l.filter(x => x !== h) : [...l, h]; if (!draft.safety.hiRisk.length) draft.safety.permits = ''; return redraw(); }
    const y = e.target.closest('[data-yn] button'); if (y) { readForm(); const k = y.closest('[data-yn]').dataset.yn; draft.safety[k] = draft.safety[k] === y.dataset.v ? '' : y.dataset.v; return redraw(); }
    const b = e.target.closest('[data-a]'); if (!b) return; const a = b.dataset.a, i = +b.dataset.i;
    if (a === 'addcrew') { readForm(); draft.crew.push(''); redraw(); main.querySelector(`[data-crew="${draft.crew.length - 1}"]`)?.focus(); }
    if (a === 'delcrew') { readForm(); draft.crew.splice(i, 1); if (!draft.crew.length) draft.crew.push(''); redraw(); }
    if (a === 'addmat') { readForm(); draft.materials.push({ item: '', qty: '', unit: '' }); redraw(); main.querySelector(`[data-m="${draft.materials.length - 1}"] [data-k=item]`)?.focus(); }
    if (a === 'delmat') { readForm(); draft.materials.splice(i, 1); if (!draft.materials.length) draft.materials.push({ item: '', qty: '', unit: '' }); redraw(); }
    if (a === 'addissue') { readForm(); draft.issues.push({ text: '', comment: '' }); redraw(); main.querySelector(`.issue[data-i="${draft.issues.length - 1}"] [data-k=text]`)?.focus(); }
    if (a === 'delissue') { readForm(); draft.issues.splice(i, 1); photos.forEach(p => { if (p.issue === i) p.issue = -1; else if (p.issue > i) p.issue--; }); redraw(); }
    if (a === 'cam' || a === 'gal') pick(a, i);
    if (a === 'delph') { photos.splice(i, 1); drawPhotos(); }
  };
  $('#send').onclick = send;
}
const issueHtml = (x, i) => `<div class="issue" data-i="${i}"><button class="x" data-a="delissue" data-i="${i}" aria-label="Remove">×</button>
  <input placeholder="What's wrong? e.g. Leak at valve V-12, plant room" value="${esc(x.text)}" data-k="text" style="padding-right:36px">
  <textarea placeholder="Where, cause, what you did or need (optional)" style="min-height:56px;margin-top:6px" data-k="comment">${esc(x.comment)}</textarea>
  <div class="thumbs" data-ph="${i}"></div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn sm" data-a="cam" data-i="${i}">📷 Photo</button><button class="btn sm" data-a="gal" data-i="${i}">🖼 Gallery</button></div></div>`;
function readForm() {
  const d = draft, v = id => $('#' + id)?.value ?? '';
  d.projectId = $('#pid')?.value || ''; d.projectName = d.projectId && d.projectId !== 'other' ? (me.projects.find(p => p.id === d.projectId)?.name || '') : v('pname').trim();
  d.date = v('date'); d.arrive = v('arrive'); d.leave = v('leave'); d.weather = v('weather'); d.weatherNote = v('weatherNote');
  d.crew = [...document.querySelectorAll('[data-crew]')].map(i => i.value); d.done = v('done'); d.outstanding = v('outstanding'); d.deliveries = v('deliveries'); d.notes = v('notes');
  d.materials = [...document.querySelectorAll('[data-m]')].map(el => ({ item: el.querySelector('[data-k=item]').value, qty: el.querySelector('[data-k=qty]').value, unit: el.querySelector('[data-k=unit]').value }));
  d.issues = [...document.querySelectorAll('.issue')].map(el => ({ text: el.querySelector('[data-k=text]').value, comment: el.querySelector('[data-k=comment]').value }));
  for (const k of ['ppeNote', 'toolboxTopic', 'permitNote', 'incidentType', 'incidentNote', 'hazards']) if ($('#' + k)) d.safety[k] = v(k);
  lsSet('draft2', d);
}
function redraw() { const y = scrollY; draw(); scrollTo(0, y); }
function drawPhotos() {
  const t = (p, i) => `<div class="t"><img src="${p.url}" alt=""><button class="x" data-a="delph" data-i="${i}">×</button><input placeholder="Caption" value="${esc(p.caption)}" data-cap="${i}"></div>`;
  $('#gph').innerHTML = photos.map((p, i) => p.issue === -1 ? t(p, i) : '').join('');
  document.querySelectorAll('[data-ph]').forEach(el => { el.innerHTML = photos.map((p, i) => p.issue === +el.dataset.ph ? t(p, i) : '').join(''); });
  document.querySelectorAll('[data-cap]').forEach(i => i.oninput = () => { photos[+i.dataset.cap].caption = i.value; });
}
function pick(src, issue) {
  const inp = $(src === 'cam' ? '#cam' : '#gal'); inp.value = '';
  inp.onchange = async () => { for (const f of inp.files) { try { photos.push({ ...(await shrink(f)), caption: '', issue }); } catch { /* skip */ } } drawPhotos(); };
  inp.click();
}
// 1600 px JPEG: sharp enough for a report, small enough for site data
function shrink(file) {
  return new Promise((res, rej) => {
    const img = new Image(); img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src);
      const url = c.toDataURL('image/jpeg', 0.82); res({ url, data: url.split(',')[1], type: 'image/jpeg' });
    }; img.onerror = rej; img.src = URL.createObjectURL(file);
  });
}
// Safety answers as plain lines (WhatsApp fallback). Same wording the app uses.
function safetyLines(s) {
  const a = (k, yes = 'Yes', no = 'NO') => s[k] === 'yes' ? yes : s[k] === 'no' ? no : s[k] === 'na' ? 'N/A' : '-';
  return [`PPE worn by everyone: ${a('ppe')}${s.ppe === 'no' && s.ppeNote ? ' — ' + s.ppeNote : ''}`, `Toolbox talk: ${a('toolbox')}${s.toolbox === 'yes' && s.toolboxTopic ? ' — ' + s.toolboxTopic : ''}`,
    `High-risk work: ${s.hiRisk.length ? s.hiRisk.join(', ') : 'none'}`, ...(s.hiRisk.length ? [`Permits / controls in place: ${a('permits')}${s.permits === 'no' && s.permitNote ? ' — ' + s.permitNote : ''}`] : []),
    `Ladders / scaffolds checked: ${a('access')}`, `Tools & leads in good condition: ${a('tools')}`, `Extinguisher at hot work: ${a('fire')}`, `First aid kit on site: ${a('firstAidKit')}`,
    `Injury / near miss: ${s.incident === 'yes' ? [s.incidentType, s.incidentNote].filter(Boolean).join(' — ') : s.incident === 'no' ? 'None' : '-'}`, `Area left clean & safe: ${a('housekeeping')}`,
    ...(s.hazards ? [`Unsafe conditions / acts: ${s.hazards}`] : [])];
}
// The same report as WhatsApp text — used if the internet send fails
function asText(b) {
  const L = (t, xs) => xs.length ? [``, t, ...xs.map(x => `  - ${x}`)] : [];
  const s = b.safety;
  return [`*REPORT FROM ${(b.projectName || '').toUpperCase()}*`, `Date: ${b.date}`, `Time in: ${b.arrive || '-'}   Time out: ${b.leave || '-'}`, `Weather: ${b.weather}${b.weatherNote ? ' — ' + b.weatherNote : ''}`,
    ...L(`*TECHNICIANS ON SITE (${b.crew.length})*`, b.crew), ...L('*WORK CARRIED OUT*', b.done), ...L('*OUTSTANDING WORK*', b.outstanding),
    ...(b.materials.length ? ['', '*MATERIALS NEEDED*', ...b.materials.map((m, i) => `  ${i + 1}. ${m.item} = ${[m.qty, m.unit].filter(Boolean).join(' ')}`)] : []),
    '', '*SAFETY*', ...safetyLines(s).map(x => '  ' + x),
    ...L('*PROBLEMS / DELAYS*', b.issues.map(x => x.text + (x.comment ? ` (${x.comment})` : ''))), ...(b.deliveries ? ['', '*DELIVERIES & VISITORS*', b.deliveries] : []), ...(b.notes ? ['', '*OTHER*', b.notes] : []),
    '', `— ${me.name}`].join('\n');
}
async function send() {
  readForm(); const d = draft, st = $('#st'), btn = $('#send'), s = d.safety;
  if (!d.projectName && !d.projectId) return alert('Choose the site first.');
  const crew = d.crew.map(x => x.trim()).filter(Boolean), done = lines(d.done), outstanding = lines(d.outstanding);
  if (!done.length && !outstanding.length && !d.issues.some(x => x.text.trim()) && !photos.length) return alert('Write the work carried out (or add a photo) before sending.');
  const unanswered = safetyQs().filter(k => !s[k]).length;
  if (s.incident === 'yes' && !s.incidentNote.trim()) return alert('Describe the injury / near miss before sending — what happened and who was involved.');
  const missing = [!crew.length && 'technicians on site', unanswered && `${unanswered} safety question${unanswered > 1 ? 's' : ''}`].filter(Boolean);
  if (missing.length && !confirm(`You haven't filled in: ${missing.join(', ')}.\n\nSend anyway?`)) return;
  const body = { v: 2, projectId: d.projectId === 'other' ? '' : d.projectId, projectName: d.projectName, date: d.date, arrive: d.arrive, leave: d.leave, weather: d.weather, weatherNote: d.weatherNote.trim(),
    crew, done, outstanding, materials: d.materials.filter(m => m.item.trim()).map(m => ({ item: m.item.trim(), qty: m.qty.trim(), unit: m.unit.trim() })),
    safety: { ...s, ppeNote: s.ppe === 'no' ? s.ppeNote.trim() : '', toolboxTopic: s.toolbox === 'yes' ? s.toolboxTopic.trim() : '', permits: s.hiRisk.length ? s.permits : '', permitNote: s.hiRisk.length && s.permits === 'no' ? s.permitNote.trim() : '',
      incidentType: s.incident === 'yes' ? s.incidentType : '', incidentNote: s.incident === 'yes' ? s.incidentNote.trim() : '', hazards: s.hazards.trim() },
    issues: d.issues.map((x, i) => ({ ...x, i })).filter(x => x.text.trim()).map(x => ({ text: x.text.trim(), comment: x.comment.trim(), i: x.i })),
    deliveries: d.deliveries.trim(), notes: d.notes.trim() };
  const idx = Object.fromEntries(body.issues.map((x, k) => [x.i, k])); body.issues.forEach(x => delete x.i);
  body.photos = photos.map(p => ({ data: p.data, type: p.type, caption: p.caption, issue: p.issue >= 0 ? (idx[p.issue] ?? null) : null, group: p.issue === -2 ? 'safety' : '' }));
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Sending…'; st.textContent = photos.length ? `${photos.length} photo${photos.length === 1 ? '' : 's'}` : '';
  try {
    const r = await fetch(`${RELAY}/send`, { method: 'POST', headers: { 'content-type': 'application/json', 'x-code': code }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'The server refused the report');
    lsSet('lastSent', Date.now()); lsSet('lastCrew', crew.length ? crew : null); if (d.projectId) lsSet('lastProject', d.projectId);
    localStorage.removeItem('draft2'); photos = []; draft = blank(); draw(); window.scrollTo(0, 0);
    main.insertAdjacentHTML('afterbegin', `<div class="banner good"><b>Report sent ✓</b> Thank you.</div>`);
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Send report'; st.innerHTML = '<span class="bad">Not sent</span>';
    if (confirm(`Could not send: ${e.message}.\n\nYour report is still here. Send it as a WhatsApp message instead (without photos)?`)) location.href = `https://wa.me/?text=${encodeURIComponent(asText(body))}`;
  }
}
