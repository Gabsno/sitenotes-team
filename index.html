<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<title>Daily site report</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0F172A;--navy3:#334155;--orange:#ea580c;--orange-d:#c2410c;--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--red:#dc2626;--green:#16a34a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif}
header{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:22px 22px;border-bottom:3px solid var(--orange)}
header h1{margin:0;font-size:18px}header p{margin:3px 0 0;color:#cbd5e1;font-size:13px}
main{padding:14px 16px calc(100px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
label{display:block;font-size:13px;color:var(--navy3);font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:inherit}
textarea{min-height:88px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid var(--orange);outline-offset:-1px;border-color:var(--orange)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.btn{font:inherit;font-weight:600;border:1px solid #cbd5e1;background:#fff;color:var(--navy);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#fff}.btn.sm{min-height:36px;padding:6px 10px;font-size:13px}.btn.ghost{border-style:dashed;width:100%;color:var(--navy3)}
.btn:disabled{opacity:.5}
.issue{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px;background:#f8fafc;position:relative}.issue .x{position:absolute;top:6px;right:6px;border:0;background:none;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:4px 8px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.t{position:relative;width:84px}.t img{width:84px;height:84px;object-fit:cover;border-radius:8px;display:block;border:1px solid var(--line)}
.t input{margin-top:4px;font-size:12px;padding:4px 6px;border-radius:6px}.t .x{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:14px;line-height:24px;text-align:center;padding:0;cursor:pointer}
.line{display:flex;gap:6px;align-items:center;margin-top:6px}.line input{flex:1}.line .x{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}.dock .btn.pri{flex:1;font-size:16px}
.muted{color:var(--muted);font-size:13px}.ok{color:var(--green)}.bad{color:var(--red)}
.banner{border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}.banner.good{background:#f0fdf4;border-color:#bbf7d0;color:#166534}
.center{text-align:center;padding:40px 12px}.center h2{font-size:18px;text-transform:none;letter-spacing:0;color:var(--text)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #fff;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-3px;margin-right:6px}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header><h1>Daily site report</h1><p id="who">Loading…</p></header>
<main id="main"></main>
<input type="file" id="cam" accept="image/*" capture="environment" hidden><input type="file" id="gal" accept="image/*" multiple hidden>
<script>
'use strict';
const RELAY = 'https://sitenotes-relay.gabsno.workers.dev';
const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ls = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* full */ } };
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const code = new URLSearchParams(location.search).get('c') || ls('code', '');
let me = ls('me', null), photos = [], draft = ls('draft', null) || { projectId: '', date: today(), arrive: '', leave: '', done: '', issues: [{ text: '', comment: '' }], materials: [{ item: '', qty: '', unit: '' }], notes: '' };
const main = $('#main');

if (!code) { main.innerHTML = '<div class="card center"><h2>You need your personal link</h2><p class="muted">Ask Ntako for your report link and open it from WhatsApp. It remembers you after that.</p></div>'; $('#who').textContent = 'No link'; }
else { lsSet('code', code); start(); }

async function start() {
  try {
    const r = await fetch(`${RELAY}/me?code=${encodeURIComponent(code)}`, { signal: AbortSignal.timeout(12000) });
    if (r.status === 403) { localStorage.removeItem('code'); main.innerHTML = '<div class="card center"><h2>This link is no longer valid</h2><p class="muted">Ask Ntako for a new one.</p></div>'; $('#who').textContent = ''; return; }
    if (r.ok) { me = await r.json(); lsSet('me', me); }
  } catch { /* offline: use what we remembered */ }
  if (!me) { main.innerHTML = '<div class="card center"><h2>No connection</h2><p class="muted">Turn on data once so the page can check your link, then try again.</p><button class="btn pri" onclick="location.reload()">Try again</button></div>'; return; }
  $('#who').textContent = `${me.name} · goes straight to Ntako`;
  draw();
}
function draw() {
  const d = draft, ps = me.projects || [];
  main.innerHTML = `
  ${ls('lastSent', null) ? `<div class="banner good">Last report sent ${new Date(ls('lastSent')).toLocaleString('en-GB', { weekday: 'short', hour: '2-digit', minute: '2-digit' })} ✓</div>` : ''}
  <section class="card"><h2>Site</h2>
    <label>Project</label>${ps.length ? `<select id="pid"><option value="">Choose…</option>${ps.map(p => `<option value="${esc(p.id)}" ${d.projectId === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}<option value="other" ${d.projectId === 'other' ? 'selected' : ''}>Other (type below)</option></select>` : ''}
    <input id="pname" placeholder="Project / site name" value="${esc(d.projectName || '')}" style="margin-top:8px;${ps.length && d.projectId !== 'other' ? 'display:none' : ''}">
    <div class="g3"><div><label>Date</label><input type="date" id="date" value="${esc(d.date)}"></div><div><label>Arrived</label><input type="time" id="arrive" value="${esc(d.arrive)}"></div><div><label>Left</label><input type="time" id="leave" value="${esc(d.leave)}"></div></div>
  </section>
  <section class="card"><h2>What was done today</h2><textarea id="done" placeholder="One item per line, e.g.&#10;Installed 3 FCUs on level 2&#10;Pressure test on riser B — held 6 bar for 1 h">${esc(d.done)}</textarea></section>
  <section class="card"><h2>Issues / things Ntako should know</h2>
    <div id="issues">${d.issues.map((x, i) => issueHtml(x, i)).join('')}</div>
    <button class="btn ghost" data-a="addissue" style="margin-top:10px">+ Add another issue</button>
  </section>
  <section class="card"><h2>Materials used / needed</h2><div id="mats">${d.materials.map((m, i) => `<div class="line g3" data-m="${i}"><input placeholder="Item, e.g. 25 mm PPR pipe" value="${esc(m.item)}" data-k="item"><input placeholder="Qty" inputmode="decimal" value="${esc(m.qty)}" data-k="qty"><input placeholder="Unit" value="${esc(m.unit)}" data-k="unit" list="units"></div>`).join('')}</div>
    <datalist id="units"><option value="pcs"><option value="m"><option value="m²"><option value="bag"><option value="length"><option value="roll"><option value="L"><option value="kg"></datalist>
    <button class="btn ghost" data-a="addmat" style="margin-top:10px">+ Add material</button></section>
  <section class="card"><h2>General photos</h2><div class="thumbs" id="gph"></div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn" data-a="cam" data-i="-1">📷 Camera</button><button class="btn" data-a="gal" data-i="-1">🖼 Gallery</button></div></section>
  <section class="card"><h2>Anything else</h2><textarea id="notes" placeholder="Visitors, deliveries, delays, safety…">${esc(d.notes)}</textarea></section>
  <p class="muted" style="text-align:center">Your words are kept on this phone until the report is sent, so nothing is lost if the signal drops.</p>`;
  drawPhotos();
  const dock = document.createElement('div'); dock.className = 'dock'; dock.innerHTML = `<span class="muted" id="st"></span><button class="btn pri" id="send">Send to Ntako</button>`; document.body.append(dock);
  main.oninput = e => { readForm(); if (e.target.id === 'pid') { $('#pname').style.display = e.target.value === 'other' || !e.target.value ? '' : 'none'; } };
  main.onclick = e => {
    const b = e.target.closest('[data-a]'); if (!b) return; const a = b.dataset.a, i = +b.dataset.i;
    if (a === 'addissue') { draft.issues.push({ text: '', comment: '' }); redraw(); }
    if (a === 'addmat') { draft.materials.push({ item: '', qty: '', unit: '' }); redraw(); }
    if (a === 'delissue') { draft.issues.splice(i, 1); photos.forEach(p => { if (p.issue === i) p.issue = -1; else if (p.issue > i) p.issue--; }); if (!draft.issues.length) draft.issues.push({ text: '', comment: '' }); redraw(); }
    if (a === 'cam' || a === 'gal') pick(a, i);
    if (a === 'delph') { photos.splice(i, 1); drawPhotos(); }
  };
  $('#send').onclick = send;
}
const issueHtml = (x, i) => `<div class="issue" data-i="${i}"><button class="x" data-a="delissue" data-i="${i}" aria-label="Remove">×</button>
  <input placeholder="What's wrong? e.g. Leak at valve V-12, plant room" value="${esc(x.text)}" data-k="text" style="padding-right:36px">
  <textarea placeholder="Where, cause, what you did or need (optional)" style="min-height:56px;margin-top:6px" data-k="comment">${esc(x.comment)}</textarea>
  <div class="thumbs" data-ph="${i}"></div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn sm" data-a="cam" data-i="${i}">📷 Photo</button><button class="btn sm" data-a="gal" data-i="${i}">🖼 Gallery</button></div></div>`;
function readForm() {
  const d = draft; d.projectId = $('#pid')?.value || ''; d.projectName = d.projectId && d.projectId !== 'other' ? (me.projects.find(p => p.id === d.projectId)?.name || '') : $('#pname').value.trim();
  d.date = $('#date').value; d.arrive = $('#arrive').value; d.leave = $('#leave').value; d.done = $('#done').value; d.notes = $('#notes').value;
  d.issues = [...document.querySelectorAll('.issue')].map(el => ({ text: el.querySelector('[data-k=text]').value, comment: el.querySelector('[data-k=comment]').value }));
  d.materials = [...document.querySelectorAll('[data-m]')].map(el => ({ item: el.querySelector('[data-k=item]').value, qty: el.querySelector('[data-k=qty]').value, unit: el.querySelector('[data-k=unit]').value }));
  lsSet('draft', d);
}
function redraw() { readForm(); document.querySelector('.dock')?.remove(); draw(); }
function drawPhotos() {
  const t = (p, i) => `<div class="t"><img src="${p.url}" alt=""><button class="x" data-a="delph" data-i="${i}">×</button><input placeholder="Caption" value="${esc(p.caption)}" data-cap="${i}"></div>`;
  $('#gph').innerHTML = photos.map((p, i) => p.issue === -1 ? t(p, i) : '').join('');
  document.querySelectorAll('[data-ph]').forEach(el => { el.innerHTML = photos.map((p, i) => p.issue === +el.dataset.ph ? t(p, i) : '').join(''); });
  document.querySelectorAll('[data-cap]').forEach(i => i.oninput = () => { photos[+i.dataset.cap].caption = i.value; });
}
function pick(src, issue) {
  const inp = $(src === 'cam' ? '#cam' : '#gal'); inp.value = '';
  inp.onchange = async () => { for (const f of inp.files) { try { photos.push({ ...(await shrink(f)), caption: '', issue }); } catch { /* skip */ } } drawPhotos(); };
  inp.click();
}
// 1600 px JPEG: sharp enough for a report, small enough for site data
function shrink(file) {
  return new Promise((res, rej) => {
    const img = new Image(); img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src);
      const url = c.toDataURL('image/jpeg', 0.82); res({ url, data: url.split(',')[1], type: 'image/jpeg' });
    }; img.onerror = rej; img.src = URL.createObjectURL(file);
  });
}
async function send() {
  readForm(); const d = draft, st = $('#st'), btn = $('#send');
  if (!d.projectName && !d.projectId) return alert('Choose the project first.');
  const done = d.done.split('\n').map(s => s.trim()).filter(Boolean), issues = d.issues.filter(x => x.text.trim());
  if (!done.length && !issues.length && !photos.length && !d.notes.trim()) return alert('Write what was done today, or add a photo.');
  const body = { v: 1, projectId: d.projectId === 'other' ? '' : d.projectId, projectName: d.projectName, date: d.date, arrive: d.arrive, leave: d.leave, done, notes: d.notes.trim(),
    issues: d.issues.map((x, i) => ({ ...x, i })).filter(x => x.text.trim()).map(x => ({ text: x.text.trim(), comment: x.comment.trim(), i: x.i })),
    materials: d.materials.filter(m => m.item.trim()).map(m => ({ item: m.item.trim(), qty: m.qty.trim(), unit: m.unit.trim() })) };
  const idx = Object.fromEntries(body.issues.map((x, k) => [x.i, k])); body.issues.forEach(x => delete x.i);
  body.photos = photos.map(p => ({ data: p.data, type: p.type, caption: p.caption, issue: p.issue === -1 ? null : (idx[p.issue] ?? null) }));
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Sending…'; st.textContent = `${photos.length} photo${photos.length === 1 ? '' : 's'}`;
  try {
    const r = await fetch(`${RELAY}/send`, { method: 'POST', headers: { 'content-type': 'application/json', 'x-code': code }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'The server refused the report');
    lsSet('lastSent', Date.now()); localStorage.removeItem('draft'); photos = [];
    draft = { projectId: d.projectId, date: today(), arrive: '', leave: '', done: '', issues: [{ text: '', comment: '' }], materials: [{ item: '', qty: '', unit: '' }], notes: '' };
    document.querySelector('.dock')?.remove(); draw(); window.scrollTo(0, 0);
    main.insertAdjacentHTML('afterbegin', '<div class="banner good"><b>Sent ✓</b> Ntako has it in his app. Thank you.</div>');
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Send to Ntako'; st.innerHTML = `<span class="bad">Not sent</span>`;
    alert(`Could not send: ${e.message}. Your report is still here — check the signal and tap Send again.`);
  }
}
</script>
</body>
</html>
